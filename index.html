<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta property="og:type" content="website" />

  <script src="https://quge5.com/88/tag.min.js" data-zone="305518" async data-cfasync="false"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      color: #ffffff;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .unmute-btn {
      position: fixed;
      top: 18px;
      right: 16px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #222222;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 9px 15px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
    }
    .center-stage {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
    }
    .play-ring-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .arc-spinner {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, 0.14);
      border-top-color: #ffffff;
      animation: spinRing 0.9s linear infinite;
      pointer-events: none;
    }
    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }
    .red-play-circle {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #e11d2a;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 6px 24px rgba(225, 29, 42, 0.45);
    }
    .red-play-circle svg {
      width: 30px;
      height: 30px;
      margin-left: 4px;
    }
    .buffering-caption {
      font-size: 15px;
      font-weight: 500;
      color: #e5e5e5;
      letter-spacing: 0.2px;
      text-align: center;
    }
  </style>
</head>
<body>
  <a href="javascript:void(0)" class="unmute-btn" id="unmuteBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
    <span>Tap to Unmute</span>
  </a>

  <div class="center-stage">
    <div class="play-ring-wrap">
      <div class="arc-spinner"></div>
      <a href="javascript:void(0)" class="red-play-circle" id="playBtn" aria-label="Play">
        <svg viewBox="0 0 36 36" aria-hidden="true">
          <polygon points="10,6 30,18 10,30" fill="#ffffff"></polygon>
        </svg>
      </a>
    </div>
    <div class="buffering-caption">Buffering HD Stream (99%)...</div>
  </div>
</body>
</html>
