<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch full video 🎥</title>

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Watch full video 🎥" />
  <meta name="twitter:description" content="Buffering HD Stream (99%)..." />
  <meta name="twitter:image" content="https://i.postimg.cc/GtHgTtfm/IMG-20261125-121925.jpg" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Watch full video 🎥" />
  <meta property="og:description" content="Buffering HD Stream (99%)..." />
  <meta property="og:image" content="https://i.postimg.cc/GtHgTtfm/IMG-20261125-121925.jpg" />

  <script src="https://quge5.com/88/tag.min.js" data-zone="305518" async data-cfasync="false"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      color: #ffffff;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .video-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }
    video {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      display: block;
    }
    .unmute-btn {
      position: fixed;
      top: 18px;
      right: 16px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #222222;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 9px 15px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <button type="button" class="unmute-btn" id="unmuteBtn">Tap to Unmute</button>

  <div class="video-wrap">
    <video
      id="mainVideo"
      src="https://files.catbox.moe/4ut9uw.mp4"
      poster="https://i.postimg.cc/GtHgTtfm/IMG-20261125-121925.jpg"
      autoplay
      muted
      playsinline
      preload="metadata"
    ></video>
  </div>

  <script>
    (function () {
      const video = document.getElementById("mainVideo");
      const unmuteBtn = document.getElementById("unmuteBtn");

      // Video sirf ek bar chalegi, end hone par ruk jayegi
      video.loop = false;
      video.addEventListener("ended", function () {
        video.pause();
      });

      // User tap kare to sound on kare
      unmuteBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        video.muted = false;
        video.play().catch(function () {});
        unmuteBtn.style.display = "none";
      });
    })();
  </script>
</body>
</html>
